[project]
name = "stockapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "keyring>=25.7.0",
    "platformdirs>=4.14.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.12.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
