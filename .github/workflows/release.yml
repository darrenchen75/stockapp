name: release

on:
  push:
    tags: ["v*"]
  pull_request:      # builds and smoke-tests all three OSes; publishes nothing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - run: uv sync
      - run: uv run pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false  # one OS failing still shows how the others did
      matrix:
        include:
          - os: macos-latest   # Apple Silicon; add macos-13 for Intel Macs
            mode: --onedir     # .app bundle, wrapped in a .dmg below
          - os: windows-latest
            mode: --onefile
          - os: ubuntu-22.04   # oldest glibc available, so the AppImage runs on older distros
            mode: --onedir     # wrapped in an AppImage below
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install libs for Linux bundle
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0  # PyInstaller bundles it
      - run: uv sync
      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > app/version.py
      - run: bash packaging/build.sh ${{ matrix.mode }}
      # Run a strategy that imports the stdlib, pandas and numpy inside the built app; exits 1 if any is missing
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: dist/StockBars.app/Contents/MacOS/StockBars --selftest packaging/smoke_strategy.py
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |  # libEGL comes with every desktop; installed after the build so it is not bundled
          sudo apt-get install -y libegl1
          dist/StockBars/StockBars --selftest packaging/smoke_strategy.py
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |  # a windowed exe returns at once unless waited on
          $p = Start-Process dist/StockBars.exe -ArgumentList '--selftest', "$PWD/packaging/smoke_strategy.py" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "selftest exit code $($p.ExitCode)"; exit 1 }
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname StockBars -srcfolder dist/StockBars.app -ov -format UDZO StockBars-macos.dmg
          ditto -c -k --keepParent dist/StockBars.app StockBars-macos.zip
      - name: Package Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/StockBars.exe -DestinationPath StockBars-windows.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: ./packaging/appimage.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: StockBars-*
